# Upptime – Uptime-Monitoring über GitHub Actions (https://upptime.js.org)
# Öffentliches Repo worldwideweber/uptime: Actions-Minuten und Status-Seite (GitHub Pages) sind dann kostenlos.
# Nur öffentliche Live-Domains eintragen – keine Staging-URLs, keine Zugangsdaten.
# Ausfall → Issue in diesem Repo (Benachrichtigung über GitHub), Wiederherstellung → Issue wird geschlossen.
owner: worldwideweber
repo: uptime

sites:
  # Neues Projekt = ein Eintrag. Optional: expectedStatusCodes, maxResponseTime (ms), check: "ssl" für Zertifikat
  - name: Fanfarenzug Nusplingen
    url: https://fanfarenzug-nusplingen.de
    maxResponseTime: 5000
  - name: TSV Nusplingen
    url: https://tsv-nusplingen.de
    maxResponseTime: 5000
  - name: ACW
    url: https://www.acweber.eu
    maxResponseTime: 5000

# Wer bei Ausfällen zugewiesen (und damit benachrichtigt) wird
assignees:
  - worldwideweber

workflowSchedule:
  uptime: '*/5 * * * *'      # GitHub startet geplante Läufe oft verzögert (realistisch 5–15 min)
  responseTime: '0 23 * * *'
  graphs: '0 0 * * *'
  summary: '0 0 * * *'
  staticSite: '0 1 * * *'
  updateTemplate: '0 0 * * *'
  updates: '0 3 * * *'

status-website:
  # Status-Seite unter https://worldwideweber.github.io/uptime/
  baseUrl: /uptime
  name: Status
  introTitle: Status der Websites
  introMessage: Erreichbarkeit und Antwortzeiten der von world-wide-weber betreuten Websites.
  navbar:
    - title: Status
      href: /uptime/

i18n:
  activeIncidents: Aktuelle Störungen
  allSystemsOperational: Alle Websites erreichbar
  incidentReport: Störung
  pastIncidents: Vergangene Störungen
  up: erreichbar
  down: nicht erreichbar
  degraded: langsam
